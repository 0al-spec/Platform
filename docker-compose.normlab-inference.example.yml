# Opt-in overlay for docker-compose.normlab-staging.example.yml. No host ports.
services:
  normlab:
    environment:
      NORMLAB_INFERENCE_MODE: gateway
      NORMLAB_INFERENCE_GATEWAY_URL: http://normlab-inference-gateway:4318
      NORMLAB_INFERENCE_TOKEN_FILE: /run/secrets/normlab_inference_token
    secrets:
      - normlab_inference_token
    networks:
      - inference-private
    depends_on:
      normlab-inference-gateway:
        condition: service_healthy

  normlab-inference-gateway:
    image: "${PLATFORM_NORMLAB_IMAGE:?set the new digest-pinned NormLab image}"
    # Refuse the legacy image, whose hardcoded routes would ignore BASE_URL settings.
    command: [/bin/sh, -ec, "test -f server/inference-endpoints.ts; exec node_modules/.bin/tsx server/inference-gateway.ts"]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - "/tmp:size=32m,mode=1777"
      # Masks the image's VOLUME, which would otherwise add a writable anonymous volume.
      - "/var/lib/normlab:size=64k,mode=0500"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 64
    stop_grace_period: 15s
    environment:
      NORMLAB_INFERENCE_TOKEN_FILE: /run/secrets/normlab_inference_token
      NORMLAB_OPENAI_API_KEY_FILE: /run/secrets/normlab_openai_api_key
      NORMLAB_OPENAI_MODEL: "${PLATFORM_NORMLAB_OPENAI_MODEL:-gpt-6-luna}"
      NORMLAB_OPENAI_BASE_URL: "${PLATFORM_NORMLAB_OPENAI_BASE_URL:-https://api.openai.com/v1}"
      NORMLAB_TYPESAFE_BASE_URL: "${PLATFORM_NORMLAB_TYPESAFE_BASE_URL:-https://api.typesafe.ai/v1}"
      NORMLAB_INFERENCE_CLASSIFIER: openai
      NORMLAB_INFERENCE_REQUESTS_PER_HOUR: "${PLATFORM_NORMLAB_INFERENCE_REQUESTS_PER_HOUR:-6}"
      NORMLAB_INFERENCE_EGRESS_PROXY: http://normlab-inference-egress:4319
    secrets:
      - normlab_inference_token
      - normlab_openai_api_key
    networks:
      - inference-private
      - inference-proxy-private
    depends_on:
      normlab-inference-egress:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4318/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  normlab-inference-egress:
    image: "${PLATFORM_NORMLAB_IMAGE:?set the new digest-pinned NormLab image}"
    command: [/bin/sh, -ec, "test -f server/inference-endpoints.ts; exec node_modules/.bin/tsx server/inference-egress.ts"]
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    tmpfs:
      - "/tmp:size=16m,mode=1777"
      # Masks the image's VOLUME, which would otherwise add a writable anonymous volume.
      - "/var/lib/normlab:size=64k,mode=0500"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: "0.10"
    pids_limit: 64
    stop_grace_period: 15s
    environment:
      NORMLAB_OPENAI_BASE_URL: "${PLATFORM_NORMLAB_OPENAI_BASE_URL:-https://api.openai.com/v1}"
      NORMLAB_TYPESAFE_BASE_URL: "${PLATFORM_NORMLAB_TYPESAFE_BASE_URL:-https://api.typesafe.ai/v1}"
    networks:
      - inference-proxy-private
      - inference-egress
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4319/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  inference-private:
    internal: true
  inference-proxy-private:
    internal: true
  inference-egress:
    internal: false

secrets:
  normlab_inference_token:
    file: /srv/0al/secrets/normlab-inference/gateway-token
  normlab_openai_api_key:
    file: /srv/0al/secrets/normlab-inference/openai-api-key
